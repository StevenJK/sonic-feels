<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sonic Moments</title>
<style>
  :root {
    --ink: #14110d;
    --paper: #f4efe6;
    --accent: #e0895f;
    --card: #1a1611;
    --line: #2a2620;
    --mono: ui-monospace, 'Cascadia Mono', 'Roboto Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--ink); color: var(--paper);
    font-family: Georgia, 'Times New Roman', serif;
    min-height: 100vh; display: flex; justify-content: center;
  }
  #app { width: 100%; max-width: 430px; padding: 20px 18px 40px; display: flex; flex-direction: column; gap: 16px; }

  .eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--accent); }
  h1 { font-size: 28px; font-weight: 400; line-height: 1.1; }
  .sub { font-size: 14px; opacity: .55; line-height: 1.5; }

  nav { display: flex; gap: 8px; }
  nav button {
    flex: 1; background: transparent; color: var(--paper); border: 1px solid var(--line);
    border-radius: 20px; padding: 9px 0; font-family: var(--mono); font-size: 12px;
    letter-spacing: .08em; cursor: pointer;
  }
  nav button.on { background: var(--accent); color: var(--ink); border-color: var(--accent); font-weight: 700; }

  .stage {
    position: relative; aspect-ratio: 3/4; background: #000;
    border-radius: 8px; overflow: hidden; border: 1px solid var(--line);
  }
  .stage video, .stage img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #stillShot { position: absolute; inset: 0; }
  .badge {
    position: absolute; top: 10px; left: 12px; font-family: var(--mono);
    font-size: 11px; letter-spacing: .1em; color: #fff; text-shadow: 0 1px 3px #000;
  }
  .reclight {
    position: absolute; top: 10px; right: 12px; width: 10px; height: 10px; border-radius: 50%;
    background: #e5484d; animation: pulse 1s infinite; display: none;
  }
  .reclight.on { display: block; }
  @keyframes pulse { 50% { opacity: .3; } }

  .bigbtn {
    background: var(--accent); color: var(--ink); border: none; border-radius: 26px;
    padding: 14px 0; width: 100%; font-family: var(--mono); font-size: 13px;
    letter-spacing: .1em; font-weight: 700; cursor: pointer;
  }
  .bigbtn:disabled { opacity: .4; cursor: default; }
  .ghost {
    background: transparent; color: var(--paper); border: 1px solid var(--line);
    border-radius: 26px; padding: 12px 18px; font-family: var(--mono); font-size: 12px; cursor: pointer;
  }
  .meta { font-family: var(--mono); font-size: 11.5px; opacity: .55; line-height: 1.7; }
  .warn { font-family: var(--mono); font-size: 12px; color: #e0a95f; line-height: 1.5; }

  .strip { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 4px; }
  .strip img {
    width: 42px; height: 42px; flex-shrink: 0; border-radius: 4px; object-fit: cover;
    opacity: .5; cursor: pointer; outline: 2px solid transparent;
  }
  .strip img.on { opacity: 1; outline-color: var(--accent); }

  .atom {
    display: flex; gap: 12px; align-items: center; background: var(--card);
    border: 1px solid var(--line); border-radius: 8px; padding: 10px; cursor: pointer;
  }
  .atom img { width: 60px; height: 60px; border-radius: 6px; object-fit: cover; }
  .atom .t { font-size: 15px; }
  .atom .d { font-family: var(--mono); font-size: 11px; opacity: .55; margin-top: 3px; }
  .atom .del {
    margin-left: auto; background: none; border: none; color: var(--paper);
    opacity: .35; font-size: 18px; cursor: pointer; padding: 8px;
  }

  .mapbox {
    aspect-ratio: 16/9; background: var(--card); border: 1px solid var(--line);
    border-radius: 8px; overflow: hidden;
  }
  .empty {
    border: 1px dashed var(--line); border-radius: 8px; padding: 36px 20px;
    text-align: center; font-size: 15px; opacity: .6; line-height: 1.6;
  }
  .modes { display: flex; gap: 6px; }
  .modes button {
    flex: 1; background: transparent; color: var(--paper); border: 1px solid var(--line);
    border-radius: 18px; padding: 8px 0; font-family: var(--mono); font-size: 10.5px;
    letter-spacing: .06em; cursor: pointer;
  }
  .modes button.on { border-color: var(--accent); color: var(--accent); }
  .hide { display: none !important; }
</style>
</head>
<body>
<div id="app">
  <div>
    <div class="eyebrow">Sonic Moments</div>
    <h1 id="heading">Capture where you are.</h1>
    <p class="sub" id="subtext">Ten seconds of picture and sound, pinned to this time and place. All of it stays on this device.</p>
  </div>

  <nav>
    <button id="tabCapture" class="on">CAPTURE</button>
    <button id="tabReplay">MOMENTS</button>
  </nav>

  <!-- ── CAPTURE ─────────────────────────────── -->
  <section id="viewCapture">
    <div class="stage">
      <video id="preview" autoplay muted playsinline></video>
      <img id="stillShot" class="hide" alt="captured still">
      <div class="badge" id="capBadge"></div>
      <div class="reclight" id="recLight"></div>
    </div>
    <div style="height:12px"></div>
    <div class="modes">
      <button id="modeFrames" class="on">FRAMES + SOUND</button>
      <button id="modePhoto">PHOTO + CLEAN SOUND</button>
    </div>
    <div style="height:10px"></div>
    <button class="bigbtn" id="btnRecord" disabled>STARTING CAMERA…</button>
    <div style="height:10px"></div>
    <div class="meta" id="capMeta">location · waiting for GPS…</div>
    <div class="warn hide" id="capWarn"></div>
  </section>

  <!-- ── REPLAY: one moment ──────────────────── -->
  <section id="viewPlayer" class="hide">
    <div class="stage">
      <img id="playFrame" alt="moment frame">
      <div class="badge" id="playBadge"></div>
    </div>
    <div style="height:10px"></div>
    <div class="strip" id="playStrip"></div>
    <div style="height:10px"></div>
    <div style="display:flex; gap:10px; align-items:center;">
      <button class="bigbtn" id="btnPlay" style="flex:1">REPLAY MOMENT</button>
      <button class="ghost" id="btnBack">All moments</button>
    </div>
    <div style="height:10px"></div>
    <div style="display:flex; gap:10px;">
      <button class="ghost" id="btnShare" style="flex:1">SHARE AS VIDEO</button>
    </div>
    <div style="height:10px"></div>
    <div class="meta" id="playMeta"></div>
    <audio id="playAudio" preload="auto"></audio>
  </section>

  <!-- ── REPLAY: library ─────────────────────── -->
  <section id="viewLibrary" class="hide">
    <div class="mapbox"><svg id="map" viewBox="0 0 100 56.25" preserveAspectRatio="none" style="width:100%;height:100%"></svg></div>
    <div style="height:14px"></div>
    <div id="atomList" style="display:flex; flex-direction:column; gap:10px;"></div>
    <div style="display:flex; gap:8px; margin-bottom:14px;">
      <button class="ghost" id="btnExport" style="flex:1">EXPORT BACKUP</button>
      <label class="ghost" style="flex:1; text-align:center;">
        IMPORT<input type="file" id="fileImport" accept="application/json" style="display:none">
      </label>
    </div>
    <div class="empty hide" id="emptyState">No moments yet.<br>Capture your first one — ten seconds, wherever you're standing.</div>
  </section>
</div>

<script>
"use strict";
// ═══════════════════════════════════════════════════════════════
// SONIC MOMENTS — all local. Camera+mic via getUserMedia, GPS via
// Geolocation, frames pulled per-second onto canvas, everything
// stored in IndexedDB. No network calls anywhere in this file.
// ═══════════════════════════════════════════════════════════════

const CLIP_SECONDS = 10;

// ── tiny IndexedDB layer ─────────────────────────────────────
const db = {
  _p: null,
  open() {
    if (this._p) return this._p;
    this._p = new Promise((res, rej) => {
      const r = indexedDB.open("sonic-moments", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("atoms", { keyPath: "id" });
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    return this._p;
  },
  async put(atom) {
    const d = await this.open();
    return new Promise((res, rej) => {
      const tx = d.transaction("atoms", "readwrite");
      tx.objectStore("atoms").put(atom);
      tx.oncomplete = res; tx.onerror = () => rej(tx.error);
    });
  },
  async all() {
    const d = await this.open();
    return new Promise((res, rej) => {
      const rq = d.transaction("atoms").objectStore("atoms").getAll();
      rq.onsuccess = () => res(rq.result.sort((a, b) => a.t - b.t));
      rq.onerror = () => rej(rq.error);
    });
  },
  async del(id) {
    const d = await this.open();
    return new Promise((res, rej) => {
      const tx = d.transaction("atoms", "readwrite");
      tx.objectStore("atoms").delete(id);
      tx.oncomplete = res; tx.onerror = () => rej(tx.error);
    });
  }
};

// ── element handles ──────────────────────────────────────────
const $ = (id) => document.getElementById(id);
const els = {
  tabCapture: $("tabCapture"), tabReplay: $("tabReplay"),
  viewCapture: $("viewCapture"), viewPlayer: $("viewPlayer"), viewLibrary: $("viewLibrary"),
  preview: $("preview"), capBadge: $("capBadge"), recLight: $("recLight"),
  btnRecord: $("btnRecord"), capMeta: $("capMeta"), capWarn: $("capWarn"),
  modeFrames: $("modeFrames"), modePhoto: $("modePhoto"), stillShot: $("stillShot"),
  playFrame: $("playFrame"), playBadge: $("playBadge"), playStrip: $("playStrip"),
  btnPlay: $("btnPlay"), btnBack: $("btnBack"), playMeta: $("playMeta"), playAudio: $("playAudio"),
  map: $("map"), atomList: $("atomList"), emptyState: $("emptyState"),
  btnShare: $("btnShare"), btnExport: $("btnExport"), fileImport: $("fileImport"),
  heading: $("heading"), subtext: $("subtext"),
};

// ── state ────────────────────────────────────────────────────
let stream = null, recorder = null, chunks = [];
let frameGrabs = [];   // jpeg blobs grabbed live during recording
let lastFix = null;          // { lat, lng, acc }
let current = null;          // atom being replayed
let playRAF = null, playIdx = -1;
let objectURLs = [];         // revoke on view change

function fmtWhen(t) {
  return new Date(t).toLocaleString([], { dateStyle: "medium", timeStyle: "short" });
}
function fmtCoord(a) {
  if (!a.lat) return "no location captured";
  return a.lat.toFixed(5) + ", " + a.lng.toFixed(5) + (a.acc ? "  ±" + Math.round(a.acc) + "m" : "");
}
function releaseURLs() { objectURLs.forEach(URL.revokeObjectURL); objectURLs = []; }
function makeURL(blob) { const u = URL.createObjectURL(blob); objectURLs.push(u); return u; }

// ── GPS: keep a rolling fix so capture stamps instantly ──────
function startGPS() {
  if (!("geolocation" in navigator)) {
    els.capMeta.textContent = "location · not available on this device";
    return;
  }
  navigator.geolocation.watchPosition(
    (p) => {
      lastFix = { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy };
      els.capMeta.textContent = "location · " + fmtCoord(lastFix);
    },
    () => { els.capMeta.textContent = "location · permission needed (moment still saves without it)"; },
    { enableHighAccuracy: true, maximumAge: 15000 }
  );
}

// ── camera boot ──────────────────────────────────────────────
async function startCamera() {
  try {
    // Audio defaults are tuned for phone calls: echo cancellation, noise
    // suppression and auto gain strip out everything that isn't speech, which
    // guts ambient sound and music. Turn all of it off and capture raw stereo.
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment", width: { ideal: 1280 } },
      audio: {
        echoCancellation: false,
        noiseSuppression: false,
        autoGainControl: false,
        channelCount: 2,
        sampleRate: 48000,
      }
    });
    els.preview.srcObject = stream;
    // report what the mic actually granted — constraints can be ignored
    const track = stream.getAudioTracks()[0];
    if (track) {
      const st = track.getSettings ? track.getSettings() : {};
      const proc = [
        st.noiseSuppression ? "noise-suppression ON" : "noise-suppression off",
        st.autoGainControl ? "auto-gain ON" : "auto-gain off",
      ].join(" · ");
      els.capMeta.textContent = els.capMeta.textContent + "\nmic · " + proc;
      els.capMeta.style.whiteSpace = "pre-line";
    }
    els.btnRecord.disabled = false;
    els.btnRecord.textContent = "CAPTURE " + CLIP_SECONDS + "s";
  } catch (e) {
    els.btnRecord.textContent = "CAMERA BLOCKED";
    els.capWarn.classList.remove("hide");
    els.capWarn.textContent =
      "Camera or mic was blocked. If this is running inside a sandboxed preview, permissions may not reach the page — the same file works when opened directly in Chrome or hosted. Otherwise check site permissions and reload.";
  }
}

// ── record: audio only, frames grabbed live ──────────────────
// Encoding video and audio together starves the audio encoder and produces
// gated, stuttering sound. So we never record video at all: MediaRecorder
// gets a stream containing ONLY the mic, and frames are painted straight off
// the live camera preview onto a canvas once a second. Two independent
// captures, no competition, no seeking a video file afterwards.
function record() {
  if (!stream) return;
  chunks = [];
  frameGrabs = [];

  const audioTrack = stream.getAudioTracks()[0];
  if (!audioTrack) return;
  const audioOnly = new MediaStream([audioTrack]);

  const prefer = [
    "audio/webm;codecs=opus",
    "audio/webm",
    "audio/mp4",
    "audio/ogg;codecs=opus",
  ];
  const mime = prefer.find((m) => MediaRecorder.isTypeSupported(m)) || "";
  const opts = mime ? { mimeType: mime } : {};
  opts.audioBitsPerSecond = 128000;

  recorder = new MediaRecorder(audioOnly, opts);
  recorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
  recorder.onstop = onRecorded;

  // canvas sized to the live preview
  const vw = els.preview.videoWidth || 720;
  const vh = els.preview.videoHeight || 960;
  const canvas = document.createElement("canvas");
  canvas.width = vw; canvas.height = vh;
  const ctx = canvas.getContext("2d");

  const t0 = Date.now();
  els.recLight.classList.add("on");
  els.btnRecord.disabled = true;

  // one frame per second, straight off the preview
  const grab = () => {
    try {
      ctx.drawImage(els.preview, 0, 0, vw, vh);
      canvas.toBlob((b) => { if (b) frameGrabs.push(b); }, "image/jpeg", 0.82);
    } catch (e) {}
  };
  grab();                                   // second 0
  const frameTimer = setInterval(grab, 1000);

  const tick = setInterval(() => {
    const left = CLIP_SECONDS - Math.floor((Date.now() - t0) / 1000);
    els.btnRecord.textContent = "RECORDING… " + Math.max(left, 0) + "s";
    if (left <= 0) {
      clearInterval(tick);
      clearInterval(frameTimer);
      try { recorder.stop(); } catch (e) {}
    }
  }, 250);

  recorder.start();                         // single continuous audio blob
}

// ── photo mode: one still, then audio with the camera fully OFF ──────
// The camera pipeline can starve the mic on some phones even when video
// isn't being encoded. So here we grab a single frame, shut the camera
// down completely, and only then start recording. Nothing else is running.
async function recordPhotoMode() {
  if (!stream) return;
  chunks = [];
  frameGrabs = [];

  // 1. one still off the live preview
  const vw = els.preview.videoWidth || 720;
  const vh = els.preview.videoHeight || 960;
  const canvas = document.createElement("canvas");
  canvas.width = vw; canvas.height = vh;
  canvas.getContext("2d").drawImage(els.preview, 0, 0, vw, vh);
  const still = await new Promise((r) => canvas.toBlob(r, "image/jpeg", 0.9));
  if (still) frameGrabs.push(still);

  // freeze the still on screen, then kill the camera
  els.preview.classList.add("hide");
  els.stillShot.src = URL.createObjectURL(still);
  els.stillShot.classList.remove("hide");
  stream.getVideoTracks().forEach((t) => t.stop());

  // 2. record audio with nothing else touching the hardware
  const audioTrack = stream.getAudioTracks()[0];
  const audioOnly = new MediaStream([audioTrack]);
  const prefer = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg;codecs=opus"];
  const mime = prefer.find((m) => MediaRecorder.isTypeSupported(m)) || "";
  const opts = mime ? { mimeType: mime } : {};
  opts.audioBitsPerSecond = 128000;

  recorder = new MediaRecorder(audioOnly, opts);
  recorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
  recorder.onstop = onRecordedPhoto;

  const t0 = Date.now();
  els.recLight.classList.add("on");
  els.btnRecord.disabled = true;
  const tick = setInterval(() => {
    const left = CLIP_SECONDS - Math.floor((Date.now() - t0) / 1000);
    els.btnRecord.textContent = "LISTENING… " + Math.max(left, 0) + "s";
    if (left <= 0) { clearInterval(tick); try { recorder.stop(); } catch (e) {} }
  }, 250);
  recorder.start();
}

async function onRecordedPhoto() {
  els.recLight.classList.remove("on");
  els.btnRecord.textContent = "SAVING…";
  const audioBlob = new Blob(chunks, { type: chunks[0]?.type || "audio/webm" });
  const when = Date.now();
  const fix = lastFix || { lat: null, lng: null, acc: null };

  await db.put({
    id: "a" + when,
    t: when,
    lat: fix.lat, lng: fix.lng, acc: fix.acc,
    frames: frameGrabs.slice(0, 1),
    audio: audioBlob,
    seconds: CLIP_SECONDS,
    mode: "photo",
  });
  frameGrabs = [];

  // bring the camera back for the next capture
  els.stillShot.classList.add("hide");
  els.preview.classList.remove("hide");
  await startCamera();
  showView("library");
}

async function onRecorded() {
  els.recLight.classList.remove("on");
  els.btnRecord.textContent = "SAVING…";

  const audioBlob = new Blob(chunks, { type: chunks[0]?.type || "audio/webm" });
  const when = Date.now();
  const fix = lastFix || { lat: null, lng: null, acc: null };

  // give any in-flight toBlob callbacks a moment to land
  await new Promise((r) => setTimeout(r, 250));

  const atom = {
    id: "a" + when,
    t: when,
    lat: fix.lat, lng: fix.lng, acc: fix.acc,
    frames: frameGrabs.slice(0, CLIP_SECONDS),
    audio: audioBlob,
    seconds: CLIP_SECONDS,
  };
  await db.put(atom);
  frameGrabs = [];
  els.btnRecord.disabled = false;
  els.btnRecord.textContent = "CAPTURE " + CLIP_SECONDS + "s";
  showView("library");
}

// ── library ──────────────────────────────────────────────────
async function renderLibrary() {
  releaseURLs();
  const atoms = await db.all();
  els.atomList.innerHTML = "";
  els.emptyState.classList.toggle("hide", atoms.length > 0);
  drawMap(atoms);

  for (const a of atoms) {
    const row = document.createElement("div");
    row.className = "atom";
    const thumb = document.createElement("img");
    if (a.frames && a.frames[0]) thumb.src = makeURL(a.frames[0]);
    thumb.alt = "moment thumbnail";
    const txt = document.createElement("div");
    txt.innerHTML = '<div class="t">' + fmtWhen(a.t) + '</div><div class="d">' + fmtCoord(a) + "</div>";
    const del = document.createElement("button");
    del.className = "del"; del.textContent = "×"; del.setAttribute("aria-label", "Delete this moment");
    del.onclick = async (e) => {
      e.stopPropagation();
      if (confirm("Delete this moment? It can't be recovered.")) { await db.del(a.id); renderLibrary(); }
    };
    row.append(thumb, txt, del);
    row.onclick = () => openPlayer(a);
    els.atomList.appendChild(row);
  }
}

function drawMap(atoms) {
  const svg = els.map;
  svg.innerHTML = "";
  const located = atoms.filter((a) => a.lat != null);
  if (located.length === 0) return;
  const lats = located.map((a) => a.lat), lngs = located.map((a) => a.lng);
  const mnLa = Math.min(...lats), mxLa = Math.max(...lats);
  const mnLo = Math.min(...lngs), mxLo = Math.max(...lngs);
  const pad = 0.14;
  const px = (a) => ((a.lng - mnLo) / ((mxLo - mnLo) || 1)) * (100 * (1 - 2 * pad)) + 100 * pad;
  const py = (a) => (1 - (a.lat - mnLa) / ((mxLa - mnLa) || 1)) * (56.25 * (1 - 2 * pad)) + 56.25 * pad;

  if (located.length > 1) {
    const line = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
    line.setAttribute("points", located.map((a) => px(a) + "," + py(a)).join(" "));
    line.setAttribute("fill", "none");
    line.setAttribute("stroke", "#4a3f34");
    line.setAttribute("stroke-width", "0.6");
    line.setAttribute("stroke-dasharray", "2 1.5");
    svg.appendChild(line);
  }
  located.forEach((a) => {
    const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    c.setAttribute("cx", px(a)); c.setAttribute("cy", py(a)); c.setAttribute("r", "1.6");
    c.setAttribute("fill", "#e0895f");
    svg.appendChild(c);
  });
}

// ── player ───────────────────────────────────────────────────
// Audio is decoded ONCE into memory with Web Audio and played as a single
// continuous buffer. MediaRecorder's webm has no duration index, so <audio>
// seeking on it stalls and fragments — decoding sidesteps that completely.
let audioCtx = null;
let decoded = null;      // AudioBuffer for the open moment
let srcNode = null;      // currently playing source
let gainNode = null;
let shareRAF = null;
let boost = 1;

// Peak-normalise: find the loudest sample and scale so it just approaches
// full scale. Ambient recordings sit very low, so this is usually a big lift.
function normaliseGain(buf) {
  let peak = 0;
  for (let ch = 0; ch < buf.numberOfChannels; ch++) {
    const d = buf.getChannelData(ch);
    // stride through — sampling every 16th value is plenty to find the peak
    for (let i = 0; i < d.length; i += 16) {
      const v = Math.abs(d[i]);
      if (v > peak) peak = v;
    }
  }
  if (peak < 0.0001) return 1;          // effectively silence, leave it alone
  const g = 0.89 / peak;                // leave a little headroom
  return Math.min(Math.max(g, 1), 40);  // never attenuate, cap the lift
}

function getCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function openPlayer(atom) {
  current = atom;
  stopPlayback();
  releaseURLs();
  showView("player");
  decoded = null;

  els.playStrip.innerHTML = "";
  const urls = (atom.frames || []).map((b) => makeURL(b));
  // decode every frame up front so swapping pictures never blocks playback
  urls.forEach((u) => { const pre = new Image(); pre.src = u; });
  urls.forEach((u, i) => {
    const im = document.createElement("img");
    im.src = u; im.alt = "second " + (i + 1);
    im.onclick = () => { stopPlayback(); setFrame(i); };
    els.playStrip.appendChild(im);
  });
  setFrame(0);

  els.playMeta.innerHTML =
    "captured " + fmtWhen(atom.t) + "<br>" + fmtCoord(atom) + "<br>" +
    (atom.frames?.length || 0) + " frames · decoding sound…";

  // decode the clip's audio up front
  els.btnPlay.disabled = true;
  els.btnPlay.textContent = "PREPARING SOUND…";
  atom.audio.arrayBuffer()
    .then((buf) => getCtx().decodeAudioData(buf))
    .then((audioBuffer) => {
      decoded = audioBuffer;
      // Capture stays clean (no auto-gain, so nothing gets gated); the level
      // is raised here instead, where it can't affect what was recorded.
      boost = normaliseGain(audioBuffer);
      els.btnPlay.disabled = false;
      els.btnPlay.textContent = "REPLAY MOMENT";
      els.playMeta.innerHTML =
        "captured " + fmtWhen(atom.t) + "<br>" + fmtCoord(atom) + "<br>" +
        (atom.frames?.length || 0) + " frames · " + audioBuffer.duration.toFixed(1) +
        "s of sound · boosted " + boost.toFixed(1) + "×";
    })
    .catch(() => {
      decoded = null;
      els.btnPlay.disabled = false;
      els.btnPlay.textContent = "REPLAY (NO SOUND)";
      els.playMeta.innerHTML =
        "captured " + fmtWhen(atom.t) + "<br>" + fmtCoord(atom) + "<br>" +
        (atom.frames?.length || 0) + " frames · this clip's audio wouldn't decode";
    });

  function setFrame(i) {
    playIdx = i;
    if (urls[i]) els.playFrame.src = urls[i];
    els.playBadge.textContent = String(i + 1).padStart(2, "0") + " / " + String(urls.length).padStart(2, "0") + "s";
    [...els.playStrip.children].forEach((el, j) => el.classList.toggle("on", j === i));
  }

  els.btnPlay.onclick = async () => {
    stopPlayback();
    const ctx = getCtx();
    if (ctx.state === "suspended") { try { await ctx.resume(); } catch (e) {} }

    setFrame(0);
    els.btnPlay.textContent = "PLAYING…";

    // exact length from the decoded buffer; falls back if audio failed
    const span = decoded ? decoded.duration : atom.seconds;
    let startedAt;

    if (decoded) {
      srcNode = ctx.createBufferSource();
      srcNode.buffer = decoded;
      gainNode = ctx.createGain();
      gainNode.gain.value = boost;
      // catches any transient the boost pushes too far, so loud moments
      // round off instead of clipping
      const limiter = ctx.createDynamicsCompressor();
      limiter.threshold.value = -3;
      limiter.knee.value = 0;
      limiter.ratio.value = 20;
      limiter.attack.value = 0.002;
      limiter.release.value = 0.1;
      srcNode.connect(gainNode).connect(limiter).connect(ctx.destination);
      srcNode.onended = finish;
      startedAt = ctx.currentTime;
      srcNode.start(0);            // one continuous play, no seeking, no gaps
    } else {
      startedAt = ctx.currentTime;
    }

    const follow = () => {
      const elapsed = ctx.currentTime - startedAt;
      if (elapsed >= span) { finish(); return; }
      const i = Math.min(Math.floor((elapsed / span) * urls.length), urls.length - 1);
      if (i !== playIdx) setFrame(i);
      playRAF = requestAnimationFrame(follow);
    };
    playRAF = requestAnimationFrame(follow);

    function finish() {
      if (playRAF) cancelAnimationFrame(playRAF);
      playRAF = null;
      setFrame(urls.length - 1);
      els.btnPlay.textContent = decoded ? "REPLAY MOMENT" : "REPLAY (NO SOUND)";
    }
  };
}

function stopPlayback() {
  if (playRAF) cancelAnimationFrame(playRAF);
  playRAF = null;
  if (srcNode) {
    try { srcNode.onended = null; srcNode.stop(); } catch (e) {}
    srcNode = null;
  }
}

// ── backup: export / import ──────────────────────────────────
// Everything lives in IndexedDB on this device only. Clearing site data or
// losing the phone loses every moment, so this writes the whole store out
// as one JSON file (blobs base64'd) that can be read back in later.
function blobToDataURL(b) {
  return new Promise((res) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.readAsDataURL(b);
  });
}
async function dataURLToBlob(u) { return (await fetch(u)).blob(); }

async function exportBackup() {
  els.btnExport.textContent = "PACKING…";
  const atoms = await db.all();
  const out = [];
  for (const a of atoms) {
    out.push({
      id: a.id, t: a.t, lat: a.lat, lng: a.lng, acc: a.acc,
      seconds: a.seconds, mode: a.mode || "frames",
      audio: a.audio ? await blobToDataURL(a.audio) : null,
      frames: a.frames ? await Promise.all(a.frames.map(blobToDataURL)) : [],
    });
  }
  const payload = { app: "sonic-moments", version: 1, exported: Date.now(), atoms: out };
  const blob = new Blob([JSON.stringify(payload)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "sonic-moments-" + new Date().toISOString().slice(0, 10) + ".json";
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
  els.btnExport.textContent = "EXPORT BACKUP";
}

async function importBackup(file) {
  if (!file) return;
  els.btnExport.textContent = "IMPORTING…";
  try {
    const data = JSON.parse(await file.text());
    if (data.app !== "sonic-moments") throw new Error("not a backup");
    let added = 0;
    const existing = new Set((await db.all()).map((a) => a.id));
    for (const a of data.atoms) {
      if (existing.has(a.id)) continue;      // never overwrite what's here
      await db.put({
        id: a.id, t: a.t, lat: a.lat, lng: a.lng, acc: a.acc,
        seconds: a.seconds, mode: a.mode,
        audio: a.audio ? await dataURLToBlob(a.audio) : null,
        frames: await Promise.all((a.frames || []).map(dataURLToBlob)),
      });
      added++;
    }
    alert("Imported " + added + " moment" + (added === 1 ? "" : "s") + ".");
    renderLibrary();
  } catch (e) {
    alert("That file didn't look like a Sonic Moments backup.");
  }
  els.btnExport.textContent = "EXPORT BACKUP";
}

// ── render a shareable video ─────────────────────────────────
// Instagram won't take a photo plus a separate audio file, so we build an
// actual video: the still (slowly zooming, which also keeps the canvas
// emitting frames) with the normalised audio muxed in. Recorded in real
// time, so a 10s moment takes 10s to render.
async function shareVideo(atom) {
  if (!decoded) { alert("Sound is still decoding — try again in a second."); return; }
  els.btnShare.disabled = true;

  const imgBlob = (atom.frames || [])[0];
  const frames = await Promise.all((atom.frames || []).map((b) => new Promise((res) => {
    const im = new Image(); im.onload = () => res(im); im.src = URL.createObjectURL(b);
  })));
  if (frames.length === 0) { alert("This moment has no picture to share."); els.btnShare.disabled = false; return; }

  const W = 1080, H = 1350;                    // 4:5, Instagram's tallest feed size
  const canvas = document.createElement("canvas");
  canvas.width = W; canvas.height = H;
  const c = canvas.getContext("2d");

  const ctx = getCtx();
  if (ctx.state === "suspended") { try { await ctx.resume(); } catch (e) {} }

  const src = ctx.createBufferSource();
  src.buffer = decoded;
  const g = ctx.createGain();
  g.gain.value = boost;
  const dest = ctx.createMediaStreamDestination();
  src.connect(g).connect(dest);

  const vStream = canvas.captureStream(30);
  const mixed = new MediaStream([...vStream.getVideoTracks(), ...dest.stream.getAudioTracks()]);

  // mp4 first — Instagram is far happier with it than webm
  const prefer = ["video/mp4", "video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm"];
  const mime = prefer.find((m) => MediaRecorder.isTypeSupported(m)) || "";
  const rec = new MediaRecorder(mixed, mime ? { mimeType: mime, videoBitsPerSecond: 4000000 } : undefined);
  const parts = [];
  rec.ondataavailable = (e) => { if (e.data.size) parts.push(e.data); };

  const span = decoded.duration;
  const t0 = performance.now();

  const draw = () => {
    const el = (performance.now() - t0) / 1000;
    const p = Math.min(el / span, 1);
    // pick the frame for this point (single-photo moments just hold)
    const im = frames[Math.min(Math.floor(p * frames.length), frames.length - 1)];
    const zoom = 1.06 - 0.06 * p;              // slow drift keeps frames flowing
    const ar = im.width / im.height, target = W / H;
    let dw = W * zoom, dh = H * zoom;
    if (ar > target) dw = dh * ar; else dh = dw / ar;
    c.fillStyle = "#000"; c.fillRect(0, 0, W, H);
    c.drawImage(im, (W - dw) / 2, (H - dh) / 2, dw, dh);
    if (p < 1) shareRAF = requestAnimationFrame(draw);
  };

  rec.start();
  src.start();
  shareRAF = requestAnimationFrame(draw);

  const done = new Promise((res) => { rec.onstop = res; });
  const timer = setInterval(() => {
    const left = Math.max(0, span - (performance.now() - t0) / 1000);
    els.btnShare.textContent = "RENDERING… " + left.toFixed(0) + "s";
  }, 200);

  setTimeout(() => {
    clearInterval(timer);
    if (shareRAF) cancelAnimationFrame(shareRAF);
    try { rec.stop(); } catch (e) {}
    try { src.stop(); } catch (e) {}
  }, span * 1000 + 300);

  await done;
  const type = parts[0]?.type || mime || "video/webm";
  const ext = type.includes("mp4") ? "mp4" : "webm";
  const vid = new Blob(parts, { type });
  const file = new File([vid], "sonic-moment." + ext, { type });

  els.btnShare.textContent = "SHARE AS VIDEO";
  els.btnShare.disabled = false;

  // native share sheet if available, otherwise just download it
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return; } catch (e) { /* cancelled */ }
  }
  const url = URL.createObjectURL(vid);
  const a = document.createElement("a");
  a.href = url; a.download = file.name; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}

// ── views ────────────────────────────────────────────────────
function showView(name) {
  stopPlayback();
  els.viewCapture.classList.toggle("hide", name !== "capture");
  els.viewPlayer.classList.toggle("hide", name !== "player");
  els.viewLibrary.classList.toggle("hide", name !== "library");
  els.tabCapture.classList.toggle("on", name === "capture");
  els.tabReplay.classList.toggle("on", name !== "capture");
  if (name === "capture") {
    els.heading.textContent = "Capture where you are.";
    els.subtext.textContent = "Ten seconds of picture and sound, pinned to this time and place. All of it stays on this device.";
  } else {
    els.heading.textContent = "Your moments.";
    els.subtext.textContent = "Each one replays as a living photo with the sound of the place underneath.";
    if (name === "library") renderLibrary();
  }
}

// ── wire up ──────────────────────────────────────────────────
els.tabCapture.onclick = () => showView("capture");
els.tabReplay.onclick = () => showView("library");
els.btnBack.onclick = () => showView("library");
let mode = "frames";
els.modeFrames.onclick = () => {
  mode = "frames";
  els.modeFrames.classList.add("on"); els.modePhoto.classList.remove("on");
  els.btnRecord.textContent = "CAPTURE " + CLIP_SECONDS + "s";
};
els.modePhoto.onclick = () => {
  mode = "photo";
  els.modePhoto.classList.add("on"); els.modeFrames.classList.remove("on");
  els.btnRecord.textContent = "PHOTO + " + CLIP_SECONDS + "s SOUND";
};
els.btnRecord.onclick = () => (mode === "photo" ? recordPhotoMode() : record());
els.btnExport.onclick = exportBackup;
els.fileImport.onchange = (e) => importBackup(e.target.files[0]);
els.btnShare.onclick = () => { if (current) shareVideo(current); };

startGPS();
startCamera();
</script>
</body>
